<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼？午餐抽籤機</title>
    <!-- 連結外部 CSS 樣式表 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- 大標題與抽出來的結果 -->
        <h1 id="title">今天吃什麼？</h1>

        <!-- 食物照片顯示區 (預設隱藏) -->
        <div id="food-card" class="food-card hidden">
            <img id="food-img" src="" alt="食物照片">
            <!-- 馬上出發按鈕 (預設隱藏) -->
            <a id="map-btn" href="#" target="_blank" class="map-btn hidden">🗺️ 馬上出發 (Google Maps)</a>
        </div>

        <!-- 抽籤大按鈕 -->
        <button id="draw-btn">點我抽籤 🎲</button>
    </div>

    <!-- 連結外部 JavaScript，並加上 defer 確保載入順序 -->
    <script src="script.js" defer></script>
</body>
</html>
