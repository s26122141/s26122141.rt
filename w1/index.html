<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人數位名片</title>
    <!-- 引入外部 CSS 檔案 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 個人名片容器 -->
    <div class="profile-card">
        <!-- 1. 圓形大頭照 (預設使用高質感風格替代圖，可自行替換連結) -->
        <img class="avatar" src="https://i.postimg.cc/5yrmH0cp/w.jpg" alt="大頭照">
        
        <!-- 2. 名字與簡短自我介紹 -->
        <h1 class="name">巫宗營</h1>
          <p class="bio">吃飯愛好者 | 我想吃遍全世界的菜:D(學號:26122141)</p>
        
        <!-- 3. 按鈕區塊 -->
        <div class="button-group">
            <!-- 替換 href 裡面的 # 為你的實際連結或 Email -->
            <a href="https://www.instagram.com/ryan097121?stkn=MTVqZzd1N2x1ZjVwaw%3D%3D&utm_source=qr
" target="_blank" class="btn instagram-btn">Instagram</a>
            <a href="mailto:s26122141@stu.edu.tw" class="btn email-btn">Email 我</a>
        </div>
    </div>

</body>
</html>
